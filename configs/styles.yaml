# Prompt presets used in the paper (only style / quality words, no description of the image content).
# The final positive prompt is "<prompt>, <added_prompt>".
realistic:
  prompt: realistic photo
  added_prompt: RAW photo, subject, (high detailed skin:1.2), 8k uhd, dslr, high quality, film grain
  negative_prompt: >-
    (deformed iris, deformed pupils, semi-realistic, cgi, 3d, render, sketch, cartoon, drawing, anime,
    mutated hands and fingers:1.4), (deformed, distorted, disfigured:1.3), poorly drawn, bad anatomy,
    wrong anatomy, extra limb, missing limb, floating limbs, disconnected limbs, mutation, mutated, ugly,
    disgusting, amputation
  # best with a photo-realistic checkpoint, e.g. Realistic Vision V2.0 (--base_model path/to/model.safetensors)

cartoon:
  prompt: in cartoon style
  added_prompt: best quality, extremely detailed
  negative_prompt: lowres, bad anatomy, bad hands, extra digit, fewer digits, cropped, worst quality, low quality

anime:
  prompt: in anime style
  added_prompt: high detailed, pixiv, art station
  negative_prompt: extra digit, fewer digits, cropped, worst quality, low quality

cg:
  prompt: in CG style
  added_prompt: extremely detailed
  negative_prompt: extra digit, fewer digits, cropped, worst quality, low quality

papercut:
  prompt: ((Papercut)), shapes, delicate patterns, silhouette, kirigami, sharp outline, Spread the picture
  added_prompt: (masterpiece, top quality, best quality)
  negative_prompt: frame, decorations
  # best with Fictiverse/Stable_Diffusion_PaperCut_Model
